services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: stock-backend
    ports:
      - "8000:8000"
    
    env_file:
      - backend/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - API_BASE=${API_BASE:-http://stock-backend:8000}
    container_name: stock-frontend
    env_file:
      - frontend/.env
    ports:
      - "5000:80"
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  default:
    name: stock-replenishment-network
